[package]
name = "authserver"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]

[[bin]]
name = "authserver"         # <— produced binary name
path = "src/main.rs"

[dependencies]
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"

[dev-dependencies]
actix-rt = "2"
serial_test = "3"

